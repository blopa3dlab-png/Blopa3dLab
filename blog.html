<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog - Blopa3dLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-white text-stone-800">
  <div class="min-h-screen">
    <div class="container mx-auto px-6 py-8">
      <a href="index.html" class="text-amber-600 hover:underline">← Volver a inicio</a>
    </div>

    <section class="py-24 md:py-32 bg-white">
      <div class="container mx-auto px-6">
        <h1 class="text-5xl md:text-6xl font-light text-stone-800 mb-12 text-center">Blog <span class="font-semibold">Blopa3dLab</span></h1>
        
        <div id="blogPosts" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        <div id="noPosts" class="text-center text-stone-400 hidden">No hay publicaciones todavía.</div>
      </div>
    </section>
  </div>

  <script>
    // Configuración de Firebase (LA MISMA QUE EN ADMIN)
    const firebaseConfig = {
      apiKey: "AIzaSyCy-t81m-k2y7ybeM8hygK8ZrRFs1riGFY",
      authDomain: "blopa3dlab-blog.firebaseapp.com",
      projectId: "blopa3dlab-blog",
      storageBucket: "blopa3dlab-blog.firebasestorage.app",
      messagingSenderId: "231693108798",
      appId: "1:231693108798:web:361243bb2801b130d9336f",
      measurementId: "G-NTNRYG1NPR"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function renderPosts() {
      const container = document.getElementById('blogPosts');
      const noPosts = document.getElementById('noPosts');

      try {
        const snapshot = await db.collection('posts').orderBy('date', 'desc').get();
        
        if (snapshot.empty) {
          container.innerHTML = '';
          noPosts.classList.remove('hidden');
          return;
        }

        noPosts.classList.add('hidden');
        let html = '';
        snapshot.forEach(doc => {
          const post = doc.data();
          html += `
            <div class="bg-stone-50 rounded-3xl overflow-hidden shadow-sm hover:shadow-md transition-shadow">
              ${post.image ? `<img src="${post.image}" alt="Post" class="w-full h-48 object-cover">` : ''}
              <div class="p-6">
                <p class="text-sm text-amber-600 mb-2">${post.date || 'Fecha no disponible'}</p>
                <p class="text-stone-700 leading-relaxed whitespace-pre-line">${post.content}</p>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      } catch (error) {
        console.error('Error cargando posts:', error);
        container.innerHTML = '<p class="text-red-500">Error al cargar los posts.</p>';
      }
    }

    renderPosts();
  </script>
</body>
</html>
