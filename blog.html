<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog - Blopa3dLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    /* Para que las imágenes individuales no se deformen */
    .post-image-container {
      max-height: 400px;
      overflow: hidden;
    }
    @media (max-width: 640px) {
      .post-image-container {
        max-height: 300px;
      }
    }
  </style>
</head>
<body class="bg-white text-stone-800">
  <div class="min-h-screen">
    <div class="container mx-auto px-6 py-8">
      <a href="index.html" class="text-amber-600 hover:underline">← Volver a inicio</a>
    </div>

    <section class="py-24 md:py-32 bg-white">
      <div class="container mx-auto px-6">
        <h1 class="text-5xl md:text-6xl font-light text-stone-800 mb-12 text-center">Blog <span class="font-semibold">Blopa3dLab</span></h1>
        
        <div id="blogPosts" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        <div id="noPosts" class="text-center text-stone-400 hidden">No hay publicaciones todavía.</div>
      </div>
    </section>
  </div>

  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCx-t8lm-k2y7ybM8hygK8zrRfs1ri6FY",
      authDomain: "blopa3dlab-blog.firebaseapp.com",
      projectId: "blopa3dlab-blog",
      storageBucket: "blopa3dlab-blog.firebasestorage.app",
      messagingSenderId: "231693108798",
      appId: "1:231693108798:web:361243bb2801b130d93386f",
      measurementId: "G-NTNRYG1NPR"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function renderPosts() {
      const container = document.getElementById('blogPosts');
      const noPosts = document.getElementById('noPosts');

      try {
        const snapshot = await db.collection('posts').orderBy('date', 'desc').get();
        
        if (snapshot.empty) {
          container.innerHTML = '';
          noPosts.classList.remove('hidden');
          return;
        }

        noPosts.classList.add('hidden');
        let html = '';
        snapshot.forEach(doc => {
          const post = doc.data();
          // Compatibilidad con posts antiguos (que tenían 'image' en lugar de 'images')
          const images = post.images || (post.image ? [post.image] : []);
          
          // Generar HTML de las imágenes según la cantidad
          let imagesHtml = '';
          if (images.length === 1) {
            // Una sola imagen: se muestra grande y centrada
            imagesHtml = `
              <div class="post-image-container w-full bg-stone-100">
                <img src="${images[0]}" alt="Imagen del post" class="w-full h-full object-contain">
              </div>
            `;
          } else if (images.length > 1) {
            // Múltiples imágenes: cuadrícula responsive
            const cols = images.length === 2 ? 'grid-cols-2' : 'grid-cols-2 md:grid-cols-3';
            imagesHtml = `
              <div class="grid ${cols} gap-2 p-2">
                ${images.map(img => `
                  <div class="aspect-square overflow-hidden bg-stone-100 rounded-lg">
                    <img src="${img}" alt="Imagen del post" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">
                  </div>
                `).join('')}
              </div>
            `;
          }

          html += `
            <div class="bg-stone-50 rounded-3xl overflow-hidden shadow-sm hover:shadow-md transition-shadow">
              ${imagesHtml}
              <div class="p-6">
                <p class="text-sm text-amber-600 mb-2">${post.date || 'Fecha no disponible'}</p>
                <div class="text-stone-700 leading-relaxed whitespace-pre-line">${post.content}</div>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      } catch (error) {
        console.error('Error cargando posts:', error);
        container.innerHTML = '<p class="text-red-500">Error al cargar los posts. Intenta más tarde.</p>';
      }
    }

    renderPosts();
  </script>
</body>
</html>
