<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Blopa3dLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-stone-50 text-stone-800">
  <div id="loginContainer" class="container mx-auto px-6 py-12 max-w-md">
    <div class="bg-white p-8 rounded-3xl shadow-xl">
      <h1 class="text-3xl font-light mb-6 text-center">Acceso administrador</h1>
      <form id="loginForm" class="space-y-4">
        <div><label class="block text-sm font-medium text-stone-700 mb-2">Email</label><input type="email" id="loginEmail" required class="w-full border border-stone-200 rounded-xl px-4 py-2 focus:border-amber-500 focus:ring-amber-500"></div>
        <div><label class="block text-sm font-medium text-stone-700 mb-2">Contraseña</label><input type="password" id="loginPassword" required class="w-full border border-stone-200 rounded-xl px-4 py-2 focus:border-amber-500 focus:ring-amber-500"></div>
        <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-3 rounded-xl transition-all duration-300">Entrar</button>
      </form>
      <p id="loginError" class="text-red-500 text-sm mt-4 hidden"></p>
    </div>
  </div>

  <div id="adminApp" class="container mx-auto px-6 py-12 max-w-3xl hidden">
    <div class="flex justify-between items-center mb-8"><a href="index.html" class="text-amber-600 hover:underline">← Inicio</a><button id="logoutBtn" class="text-sm text-stone-600 hover:text-stone-800">Cerrar sesión</button></div>
    <h1 class="text-4xl font-light mb-8">Panel de administración</h1>

    <form id="postForm" class="bg-white p-8 rounded-3xl shadow-xl space-y-6">
      <div><label class="block text-sm font-medium text-stone-700 mb-2">Fecha del post</label><input type="date" id="postDate" required class="w-full border border-stone-200 rounded-xl px-4 py-2 focus:border-amber-500 focus:ring-amber-500"></div>

      <div>
        <label class="block text-sm font-medium text-stone-700 mb-2">Imágenes del post</label>
        <input type="file" id="postImages" accept="image/jpeg,image/png,image/webp,image/gif" multiple class="w-full border border-stone-200 rounded-xl px-4 py-3 bg-white focus:border-amber-500 focus:ring-amber-500">
        <p class="text-xs text-stone-400 mt-1">Selecciona una o varias imágenes desde tu ordenador. Se guardan como archivos del post, sin enlaces externos.</p>
        <div id="imagePreview" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4"></div>
      </div>

      <div><label class="block text-sm font-medium text-stone-700 mb-2">Contenido del post</label><textarea id="postContent" rows="6" required placeholder="Escribe aquí tu artículo..." class="w-full border border-stone-200 rounded-xl px-4 py-2 focus:border-amber-500 focus:ring-amber-500"></textarea></div>
      <button type="submit" class="w-full bg-stone-900 hover:bg-stone-800 text-white py-3 rounded-xl transition-all duration-300">Guardar post</button>
    </form>

    <div class="mt-12"><h2 class="text-2xl font-light mb-4">Posts guardados</h2><div id="postsList" class="space-y-4"></div><button id="clearAll" class="mt-4 text-sm text-red-600 hover:underline">Eliminar todos los posts</button></div>
  </div>

  <script>
    (async function() {
      // Reutilizamos la configuración que ya usa blog.html, evitando duplicarla aquí.
      const blogSource = await fetch('blog.html').then(r => r.text());
      const configMatch = blogSource.match(/const firebaseConfig = \{([\s\S]*?)\};/);
      if (!configMatch) { document.getElementById('loginError').textContent = 'No se pudo cargar la configuración.'; document.getElementById('loginError').classList.remove('hidden'); return; }
      const config = {};
      configMatch[1].replace(/(\w+)\s*:\s*["']([^"']*)["']/g, (_, key, value) => { config[key] = value; });

      firebase.initializeApp(config);
      const auth = firebase.auth();
      const db = firebase.firestore();
      const postsRef = db.collection('posts');
      const loginContainer = document.getElementById('loginContainer');
      const adminApp = document.getElementById('adminApp');
      const loginForm = document.getElementById('loginForm');
      const loginError = document.getElementById('loginError');
      const logoutBtn = document.getElementById('logoutBtn');
      const postForm = document.getElementById('postForm');
      const postsList = document.getElementById('postsList');
      const clearAllBtn = document.getElementById('clearAll');
      const imageInput = document.getElementById('postImages');
      const imagePreview = document.getElementById('imagePreview');

      auth.onAuthStateChanged(user => {
        if (user) { loginContainer.classList.add('hidden'); adminApp.classList.remove('hidden'); loadPosts(); }
        else { loginContainer.classList.remove('hidden'); adminApp.classList.add('hidden'); }
      });

      loginForm.addEventListener('submit', async e => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        loginError.classList.add('hidden');
        try { await auth.signInWithEmailAndPassword(email, password); }
        catch (error) { loginError.textContent = 'Error: ' + error.message; loginError.classList.remove('hidden'); }
      });

      logoutBtn.addEventListener('click', () => auth.signOut());

      imageInput.addEventListener('change', () => {
        imagePreview.innerHTML = '';
        Array.from(imageInput.files).forEach(file => {
          if (!file.type.startsWith('image/')) return;
          const reader = new FileReader();
          reader.onload = event => {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = `<img src="${event.target.result}" alt="Imagen" class="w-full aspect-square object-cover rounded-xl border border-stone-200"><p class="text-xs text-stone-500 mt-1 truncate" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</p>`;
            imagePreview.appendChild(wrapper);
          };
          reader.readAsDataURL(file);
        });
      });

      function filesToDataUrls(files) {
        return Promise.all(Array.from(files).map(file => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve({ name: file.name, type: file.type, data: reader.result });
          reader.onerror = reject;
          reader.readAsDataURL(file);
        })));
      }

      function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char])); }

      async function loadPosts() {
        try {
          const snapshot = await postsRef.orderBy('date', 'desc').get();
          if (snapshot.empty) { postsList.innerHTML = '<p class="text-stone-400">No hay posts guardados.</p>'; return; }
          let html = '';
          snapshot.forEach(doc => {
            const post = doc.data(); const id = doc.id; const images = post.images || (post.image ? [post.image] : []);
            html += `<div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 relative"><p class="text-sm text-amber-600">${escapeHtml(post.date || 'Sin fecha')}</p><div class="flex flex-wrap gap-2 my-2">${images.map(img => `<img src="${img.data || img}" alt="Post" class="w-20 h-20 object-cover rounded-lg">`).join('')}</div><p class="text-stone-700 mt-2">${escapeHtml((post.content || '').substring(0,100))}${(post.content || '').length > 100 ? '…' : ''}</p><button onclick="deletePost('${id}')" class="absolute top-2 right-2 text-red-500 hover:text-red-700 text-sm">Eliminar</button></div>`;
          });
          postsList.innerHTML = html;
        } catch (error) { postsList.innerHTML = '<p class="text-red-500">Error al cargar los posts.</p>'; console.error(error); }
      }

      postForm.addEventListener('submit', async e => {
        e.preventDefault();
        const date = document.getElementById('postDate').value;
        const content = document.getElementById('postContent').value.trim();
        const files = imageInput.files;
        if (!files.length) { alert('Selecciona al menos una imagen para el post.'); return; }
        const submitButton = postForm.querySelector('button[type="submit"]');
        submitButton.disabled = true; submitButton.textContent = 'Guardando...';
        try {
          const images = await filesToDataUrls(files);
          await postsRef.add({ date, images, content, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
          postForm.reset(); imagePreview.innerHTML = ''; await loadPosts();
        } catch (error) { alert('Error al guardar: ' + error.message); }
        finally { submitButton.disabled = false; submitButton.textContent = 'Guardar post'; }
      });

      window.deletePost = async id => {
        if (confirm('¿Eliminar este post?')) { try { await postsRef.doc(id).delete(); loadPosts(); } catch (error) { alert('Error al eliminar: ' + error.message); } }
      };

      clearAllBtn.addEventListener('click', async () => {
        if (confirm('¿Eliminar TODOS los posts? Esta acción no se puede deshacer.')) {
          try { const snapshot = await postsRef.get(); const batch = db.batch(); snapshot.forEach(doc => batch.delete(doc.ref)); await batch.commit(); loadPosts(); }
          catch (error) { alert('Error al eliminar todos: ' + error.message); }
        }
      });
    })();
  </script>
</body>
</html>
