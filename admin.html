<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Blopa3dLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-stone-50 text-stone-800">
  <div id="adminApp" class="container mx-auto px-6 py-12 max-w-2xl hidden">
    <a href="index.html" class="text-amber-600 hover:underline mb-8 inline-block">← Inicio</a>
    <h1 class="text-4xl font-light mb-8">Panel de administración</h1>

    <form id="postForm" class="bg-white p-8 rounded-3xl shadow-xl space-y-6">
      <div>
        <label class="block text-sm font-medium text-stone-700 mb-2">Fecha del post</label>
        <input type="date" id="postDate" required class="w-full border border-stone-200 rounded-xl px-4 py-2 focus:border-amber-500 focus:ring-amber-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-stone-700 mb-2">URL de la imagen (opcional)</label>
        <input type="url" id="postImage" placeholder="https://ejemplo.com/imagen.jpg" class="w-full border border-stone-200 rounded-xl px-4 py-2 focus:border-amber-500 focus:ring-amber-500">
        <p class="text-xs text-stone-400 mt-1">Puedes usar una imagen de Unsplash o subirla a un servicio gratuito (Imgur, Postimages) y pegar el enlace.</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-stone-700 mb-2">Contenido del post</label>
        <textarea id="postContent" rows="6" required placeholder="Escribe aquí tu artículo..." class="w-full border border-stone-200 rounded-xl px-4 py-2 focus:border-amber-500 focus:ring-amber-500"></textarea>
      </div>
      <button type="submit" class="w-full bg-stone-900 hover:bg-stone-800 text-white py-3 rounded-xl transition-all duration-300">Guardar post</button>
    </form>

    <div class="mt-12">
      <h2 class="text-2xl font-light mb-4">Posts guardados</h2>
      <div id="postsList" class="space-y-4"></div>
      <button id="clearAll" class="mt-4 text-sm text-red-600 hover:underline">Eliminar todos los posts</button>
    </div>
  </div>

  <div id="loginMessage" class="container mx-auto px-6 py-12 max-w-2xl text-center">
    <p class="text-stone-600">Autenticando...</p>
  </div>

  <script>
    (function() {
      // Credenciales fijas
      const USERNAME = 'Pablo';
      const PASSWORD = 'P4bl08';

      // Autenticación (igual que antes)
      let authenticated = false;
      for (let i = 0; i < 3; i++) {
        const user = prompt('Usuario:');
        if (user === null) break;
        const pass = prompt('Contraseña:');
        if (pass === null) break;
        if (user === USERNAME && pass === PASSWORD) {
          authenticated = true;
          break;
        } else {
          alert('Credenciales incorrectas. Intento ' + (i+1) + ' de 3');
        }
      }

      if (!authenticated) {
        document.getElementById('loginMessage').innerHTML = '<p class="text-red-600">Acceso denegado. Redirigiendo...</p>';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);
        return;
      }

      // Mostrar panel
      document.getElementById('adminApp').classList.remove('hidden');
      document.getElementById('loginMessage').classList.add('hidden');

      // Inicializar Firebase (REEMPLAZA CON TU CONFIGURACIÓN)
      const firebaseConfig = {
        apiKey: "AIzaSyCy-t81m-k2y7ybeM8hygK8ZrRFs1riGFY",
        authDomain: "blopa3dlab-blog.firebaseapp.com",
        projectId: "blopa3dlab-blog",
        storageBucket: "blopa3dlab-blog.firebasestorage.app",
        messagingSenderId: "231693108798",
        appId: "1:231693108798:web:361243bb2801b130d9336f",
        measurementId: "G-NTNRYG1NPR"
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      // Referencia a la colección "posts"
      const postsRef = db.collection('posts');

      // Cargar posts desde Firestore
      async function loadPosts() {
        const snapshot = await postsRef.orderBy('date', 'desc').get();
        const container = document.getElementById('postsList');
        if (snapshot.empty) {
          container.innerHTML = '<p class="text-stone-400">No hay posts guardados.</p>';
          return;
        }
        let html = '';
        snapshot.forEach(doc => {
          const post = doc.data();
          const id = doc.id;
          html += `
            <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 relative">
              <p class="text-sm text-amber-600">${post.date || 'Sin fecha'}</p>
              ${post.image ? `<img src="${post.image}" alt="Post" class="w-full h-32 object-cover rounded-lg my-2">` : ''}
              <p class="text-stone-700 mt-2">${post.content.substring(0, 100)}${post.content.length > 100 ? '…' : ''}</p>
              <button onclick="deletePost('${id}')" class="absolute top-2 right-2 text-red-500 hover:text-red-700 text-sm">Eliminar</button>
            </div>
          `;
        });
        container.innerHTML = html;
      }

      // Guardar nuevo post en Firestore
      document.getElementById('postForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const date = document.getElementById('postDate').value;
        const image = document.getElementById('postImage').value;
        const content = document.getElementById('postContent').value;

        try {
          await postsRef.add({
            date,
            image,
            content,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
          document.getElementById('postForm').reset();
          loadPosts();
        } catch (error) {
          alert('Error al guardar: ' + error.message);
        }
      });

      // Eliminar un post
      window.deletePost = async (id) => {
        if (confirm('¿Eliminar este post?')) {
          try {
            await postsRef.doc(id).delete();
            loadPosts();
          } catch (error) {
            alert('Error al eliminar: ' + error.message);
          }
        }
      };

      // Eliminar todos los posts
      document.getElementById('clearAll').addEventListener('click', async () => {
        if (confirm('¿Eliminar TODOS los posts? Esta acción no se puede deshacer.')) {
          try {
            const snapshot = await postsRef.get();
            const batch = db.batch();
            snapshot.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
            loadPosts();
          } catch (error) {
            alert('Error al eliminar todos: ' + error.message);
          }
        }
      });

      // Cargar al inicio
      loadPosts();
    })();
  </script>
</body>
</html>
