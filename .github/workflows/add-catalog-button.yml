name: Add Catalog button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Catalog button to index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '''            <a href="blog.html" class="inline-flex items-center justify-center gap-2 whitespace-nowrap font-medium bg-amber-100 hover:bg-amber-200 text-amber-800 px-8 py-6 text-base rounded-full transition-all duration-300 hover:scale-105 shadow-lg shadow-amber-200/50">\n              Blog\n            </a>'''
          new = '''            <a href="blog.html" class="inline-flex items-center justify-center gap-2 whitespace-nowrap font-medium bg-amber-100 hover:bg-amber-200 text-amber-800 px-8 py-6 text-base rounded-full transition-all duration-300 hover:scale-105 shadow-lg shadow-amber-200/50">\n              Blog\n            </a>\n            <a href="catalogo.html" class="inline-flex items-center justify-center gap-2 whitespace-nowrap font-medium bg-amber-500 hover:bg-amber-400 text-stone-900 px-8 py-6 text-base rounded-full transition-all duration-300 hover:scale-105 shadow-lg shadow-amber-500/20">\n              Catálogo\n            </a>'''
          if old not in text:
              raise SystemExit('No se encontró el bloque de botones del hero')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/add-catalog-button.yml
          git commit -m "Añadir botón Catálogo al inicio"
          git push
