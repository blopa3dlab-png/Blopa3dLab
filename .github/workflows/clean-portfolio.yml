name: Clean Portfolio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove portfolio and save backup
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          start_marker = '    <!-- Galería Section -->'
          end_marker = '    <!-- Proceso Section -->'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          portfolio = text[start:end]
          Path('portfolio-backup.html').write_text(portfolio, encoding='utf-8')

          cleaned = text[:start] + text[end:]
          footer_link = "              <li><button onclick=\"scrollToId('galeria')\" class=\"hover:text-amber-400 transition-colors\">Portfolio</button></li>\n"
          cleaned = cleaned.replace(footer_link, '', 1)
          index.write_text(cleaned, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html portfolio-backup.html
          git rm .github/workflows/clean-portfolio.yml
          git commit -m "Eliminar Portfolio de index y guardar copia"
          git push
